<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>mychain — doorkeeper</title>
<style>
  :root {
    --bg: #0e1116; --card: #161b23; --edge: #232a35;
    --text: #dce3ec; --dim: #7d8896; --mono: ui-monospace, SFMono-Regular, Menlo, monospace;
    --ok: #3fb950; --bad: #f85149; --think: #a371f7; --listen: #58a6ff; --write: #d29922;
  }
  * { box-sizing: border-box; margin: 0; }
  body { background: var(--bg); color: var(--text); font: 15px/1.5 -apple-system, system-ui, sans-serif; padding: 24px; max-width: 780px; margin: 0 auto; }
  h1 { font-size: 18px; letter-spacing: .3px; display: flex; align-items: center; gap: 10px; }
  h1 .badge { font-size: 12px; padding: 2px 10px; border-radius: 20px; font-weight: 600; }
  .badge.ok  { background: rgba(63,185,80,.15); color: var(--ok); }
  .badge.bad { background: rgba(248,81,73,.15);  color: var(--bad); }
  .sub { color: var(--dim); font-size: 12.5px; margin: 4px 0 20px; font-family: var(--mono); }
  .card { background: var(--card); border: 1px solid var(--edge); border-radius: 12px; padding: 16px 18px; margin-bottom: 14px; }
  /* live agent state */
  .live { display: flex; align-items: center; gap: 14px; }
  .dot { width: 16px; height: 16px; border-radius: 50%; background: var(--dim); flex: none; }
  .dot.listening { background: var(--listen); }
  .dot.thinking  { background: var(--think); animation: pulse 1s infinite; }
  .dot.writing   { background: var(--write); animation: pulse .6s infinite; }
  .dot.allowed   { background: var(--ok); }
  .dot.denied    { background: var(--bad); }
  .dot.logged    { background: var(--ok); }
  @keyframes pulse { 50% { opacity: .35; } }
  .live .state { font-weight: 650; text-transform: capitalize; }
  .live .detail { color: var(--dim); font-size: 13.5px; }
  /* stats row */
  .stats { display: flex; gap: 14px; }
  .stat { flex: 1; text-align: center; }
  .stat b { display: block; font-size: 26px; font-weight: 700; }
  .stat span { color: var(--dim); font-size: 12px; text-transform: uppercase; letter-spacing: .5px; }
  /* events */
  h2 { font-size: 13px; color: var(--dim); text-transform: uppercase; letter-spacing: .6px; margin: 22px 0 10px; }
  .event { display: flex; gap: 12px; padding: 10px 2px; border-bottom: 1px solid var(--edge); align-items: baseline; }
  .event:last-child { border-bottom: 0; }
  .event .idx { font-family: var(--mono); color: var(--dim); font-size: 12px; flex: none; width: 30px; }
  .event .label { flex: 1; }
  .event .meta { font-family: var(--mono); font-size: 11.5px; color: var(--dim); text-align: right; flex: none; }
  .tag { font-size: 10.5px; padding: 1px 8px; border-radius: 10px; font-weight: 600; vertical-align: 1px; margin-left: 6px; }
  .tag.grant { background: rgba(63,185,80,.15); color: var(--ok); }
  .tag.deny  { background: rgba(248,81,73,.15); color: var(--bad); }
  .empty { color: var(--dim); font-style: italic; padding: 8px 2px; }
  .addr { font-family: var(--mono); font-size: 12px; color: var(--dim); }
</style>
</head>
<body>
  <h1>🛡 doorkeeper <span id="verify" class="badge">…</span></h1>
  <div class="sub" id="chaininfo">connecting…</div>

  <div class="card live">
    <div id="dot" class="dot"></div>
    <div>
      <div class="state" id="state">idle</div>
      <div class="detail" id="detail">waiting for something to happen</div>
    </div>
  </div>

  <div class="card stats">
    <div class="stat"><b id="blocks">–</b><span>blocks</span></div>
    <div class="stat"><b id="pages">–</b><span>pages</span></div>
    <div class="stat"><b id="agents">–</b><span>agents</span></div>
  </div>

  <h2>Notebook — latest pages</h2>
  <div class="card" id="events"><div class="empty">no pages yet</div></div>

  <h2>Access map</h2>
  <div class="card" id="access"><div class="empty">nothing granted or denied yet</div></div>

<script>
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const when = ts => new Date(ts * 1000).toLocaleString([], {month:'short', day:'numeric', hour:'2-digit', minute:'2-digit'});

async function j(path) { const r = await fetch(path); return r.json(); }

async function refresh() {
  try {
    const [verify, state, events, status] = await Promise.all([
      j('/verify'), j('/state'), j('/events'), j('/status')
    ]);

    const v = $('verify');
    v.textContent = verify.ok ? '✓ verified' : '✗ TAMPERED';
    v.className = 'badge ' + (verify.ok ? 'ok' : 'bad');
    $('chaininfo').textContent = verify.message + ' · owner ' + state.owner.slice(0, 10) + '…';

    $('blocks').textContent = verify.message.match(/\d+/)?.[0] ?? '–';
    $('pages').textContent = events.length;
    $('agents').textContent = state.agents.length;

    // live agent status
    const st = status.state || 'idle';
    $('state').textContent = st;
    $('detail').textContent = status.detail || '';
    $('dot').className = 'dot ' + st;

    // events, newest first
    const ev = $('events');
    if (events.length) {
      ev.innerHTML = events.slice().reverse().map(e => {
        let tag = '';
        if (e.type === 'decide_access')
          tag = e.allowed ? '<span class="tag grant">granted</span>' : '<span class="tag deny">denied</span>';
        return `<div class="event">
          <div class="idx">#${e.index}</div>
          <div class="label">${esc(e.label)}${tag}</div>
          <div class="meta">${when(e.timestamp)}<br>${esc(e.evidence_hash.slice(0, 12))}…</div>
        </div>`;
      }).join('');
    }

    // access map
    const entries = Object.entries(state.access);
    if (entries.length) {
      $('access').innerHTML = entries.map(([who, ok]) =>
        `<div class="event"><div class="label addr">${esc(who)}</div>
         <div>${ok ? '<span class="tag grant">allowed</span>' : '<span class="tag deny">denied</span>'}</div></div>`
      ).join('');
    }
  } catch (e) {
    $('chaininfo').textContent = 'node unreachable — is it running?';
  }
}
refresh();
setInterval(refresh, 2000);
</script>
</body>
</html>
